---

name: Build a docker container
description: Build docker images in the actions repository
inputs:
  dockerfile:
    description: path to the Dockerfile to build
    required: true
  image-name:
    description: name of resulting docker image (If using ECR, `${ECR_REGISTRY}/${ECR_REPOSITORY}`)
    required: true
  image-tag:
    description: image tag to use
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Build container
      shell: bash -l {0}
      # yamllint disable rule:line-length
      # Assume we don't need a filesystem location build context for actions repo dockerfiles
      run: docker build - -t ${{ inputs.image-name }}:${{ inputs.image-tag }} < ${{ inputs.dockerfile }}
      # yamllint enable rule:line-length

