---

name: Validate a Dockerfile
description: Runs minimally hadolint on a given Dockerfile

inputs:
  dockerfile:
    description: path to Dockerfile to lint
    required: true
  checked-out:
    description: |
      Whether this repository is checked out into ./actions in the caller's workspace.
      hadolint runs as a Docker action, and Docker actions can only read files under
      $GITHUB_WORKSPACE, so this is the one action here that cannot resolve its bundled
      config when referenced remotely as mat3ra/actions/docker/validate@main.
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Get path to config
      id: path
      shell: bash -l {0}
      run: |
        CONFIG_PATH=./.hadolint.yml
        if [[ "${{ inputs.checked-out }}" == "true" ]]; then
            CONFIG_PATH=./actions/.hadolint.yml
        fi
        echo "config-path=${CONFIG_PATH}" >> "$GITHUB_OUTPUT"
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
      with:
        dockerfile: ${{ inputs.dockerfile }}
        config: ${{ steps.path.outputs.config-path }}

