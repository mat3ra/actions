---

name: Publish Git Release and Python Package
description: Publishes a new version of a python package to PyPI
inputs:
  python-version:
    description: Version of Python to use
    required: true
  github-token:
    description: Grants access to publish releases to github
    required: true
  pypi-username:
    description: Username on PyPI
    required: false
    default: ''
  pypi-password:
    description: Password of PyPI user
    required: false
    default: ''
  publish-tag:
    description: Publish tag and release before publishing to PyPI
    required: true
    default: 'true'
  publish-to-pypi:
    description: Whether to only publish as a GitHub release
    required: true
    default: 'true'

runs:
  using: composite
  steps:

    - name: Configure Repository
      uses: ./actions/git/config
      with:
        github-token: ${{ inputs.github-token }}
    - name: Determine git tag
      id: get-tag-name
      uses: ./actions/git/version
      with:
        create-new-tag: ${{ inputs.publish-tag }}
    - name: Publish new git tag and release
      if: inputs.publish-tag == 'true'
      uses: ./actions/git/release
      with:
        github-token: ${{ inputs.github-token }}
        tag-name: ${{ steps.get-tag-name.outputs.tag-name }}

    - name: Setup Python ${{ inputs.python-version }}
      if: inputs.pypi-username != '' && inputs.pypi-password != '' && inputs.publish-to-pypi = 'true'
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}
    - name: Setup Python Environment
      if: inputs.pypi-username != '' && inputs.pypi-password != '' && inputs.publish-to-pypi = 'true'
      uses: ./actions/py/env
    - name: Install Dependencies
      if: inputs.pypi-username != '' && inputs.pypi-password != '' && inputs.publish-to-pypi = 'true'
      shell: bash -l {0}
      run: |
        python -m pip install \
          pip==${PIP_VERSION} \
          build==${BUILD_VERSION} \
          twine==${TWINE_VERSION}
    - name: Debug git repository
      if: inputs.pypi-username != '' && inputs.pypi-password != '' && inputs.publish-to-pypi = 'true'
      shell: bash -l {0}
      run: |
        git log -n 1
        git status
    - name: Build Package
      if: inputs.pypi-username != '' && inputs.pypi-password != '' && inputs.publish-to-pypi = 'true'
      shell: bash -l {0}
      run: python -m build
    - name: Publish Package
      if: inputs.pypi-username != '' && inputs.pypi-password != '' && inputs.publish-to-pypi = 'true'
      shell: bash -l {0}
      run: twine upload dist/*
      env:
        TWINE_USERNAME: ${{ inputs.pypi-username }}
        TWINE_PASSWORD: ${{ inputs.pypi-password }}
