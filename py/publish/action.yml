---

name: Publish Git Release and Python Package
description: Publishes a new version of a python package to PyPI
inputs:
  python-version:
    description: Version of Python to use
    required: true
  github-token:
    description: Grants access to publish releases to github
    required: true
  pypi-username:
    description: Username on PyPI
    required: true
  pypi-password:
    description: Password of PyPI user
    required: true
  publish-tag:
    description: Publish tag and release before publishing to PyPI
    required: true
    default: 'true'

runs:
  using: composite
  steps:
    - name: Configure Repository
      uses: ./actions/git/config
      with:
        github-token: ${{ inputs.github-token }}
    - name: Fetch git tags and git pull
      shell: bash -l {0}
      run: |
        git fetch --prune --unshallow --tags
        # Only really necessary when JS gets published first
        git pull origin ${{ github.ref_name }}
    - name: Publish Tag & Release to Github
      if: inputs.publish-tag == 'true'
      uses: ./actions/git/version
      with:
        github-token: ${{ inputs.github-token }}
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}
    - name: Setup Python Environment
      uses: ./actions/py/env
    - name: Install Dependencies
      shell: bash -l {0}
      run: |
        python -m pip install \
          pip==${PIP_VERSION} \
          build==${BUILD_VERSION} \
          twine==${TWINE_VERSION}
    - name: Debug git repository
      shell: bash -l {0}
      run: |
        git log -n 1
        git status
    - name: Build Package
      shell: bash -l {0}
      run: python -m build
    - name: Publish Package
      shell: bash -l {0}
      run: twine upload dist/*
      env:
        TWINE_USERNAME: ${{ inputs.pypi-username }}
        TWINE_PASSWORD: ${{ inputs.pypi-password }}
