---

name: Run Python Tests
inputs:
  python-version:
    description: Version of Python to use
    required: true

  bot-ssh-key:
    description: GitHub bot SSH private key
    required: false
    default: ''

  unit-test-directory:
    description: Path to unit tests
    required: false
    default: ''

  integration-test-directory:
    description: Path to integration tests
    required: false
    default: ''

  test-script:
    description: Path to a script that runs tests
    required: false
    default: ''

  requirements-file-basename:
    description: Basename of the requirements file
    required: false
    default: requirements.txt

  pip-install-group-name:
    description: Name of the pip install group - e.g. ".[all]"
    required: false
    default: tests

  pip-install-no-cache:
    description: Whether to enforce no cache
    required: false
    default: ''

  pypi-mat3ra-com-user:
    required: false
    default: ''
  pypi-mat3ra-com-password:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Create virtual environment
      shell: bash -l {0}
      run: python -m venv .venv

    - name: Setup Python Environment
      uses: ./actions/py/env
      with:
        pypi-mat3ra-com-user: ${{ inputs.pypi-mat3ra-com-user }}
        pypi-mat3ra-com-password: ${{ inputs.pypi-mat3ra-com-password }}

    - name: Upgrade core tools to pinned versions
      shell: bash -l {0}
      run: |
        source .venv/bin/activate
        pip install --upgrade \
          pip==$PIP_VERSION \
          setuptools==$SETUPTOOLS_VERSION \
          wheel==$WHEEL_VERSION \
          build==$BUILD_VERSION \
          twine==$TWINE_VERSION

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        source .venv/bin/activate
        MAYBE_NO_CACHE=""
        if [ ! -z "${{ inputs.pip-install-no-cache }}" ]; then
          MAYBE_NO_CACHE="--no-cache-dir"
        fi
        if [ -f "${{ inputs.requirements-file-basename }}" ]; then
          pip install ${MAYBE_NO_CACHE} -r ${{ inputs.requirements-file-basename }}
        else
          pip install ${MAYBE_NO_CACHE} ".[${{ inputs.pip-install-group-name }}]"
        fi

    - name: List dependencies explicitly
      shell: bash -l {0}
      run: |
        source .venv/bin/activate
        pip list

    - name: Run unit tests
      if: inputs.unit-test-directory != ''
      shell: bash -l {0}
      run: |
        source .venv/bin/activate
        python -m unittest discover --verbose --catch --start-directory ${{ inputs.unit-test-directory }}

    - name: Run integration tests
      if: inputs.integration-test-directory != ''
      shell: bash -l {0}
      run: |
        source .venv/bin/activate
        python -m unittest discover --verbose --catch --start-directory ${{ inputs.integration-test-directory }}

    - name: Run scripted tests
      if: inputs.test-script != ''
      shell: bash -l {0}
      run: |
        source .venv/bin/activate
        python ${{ inputs.test-script }}
