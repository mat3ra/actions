---

name: Run Python Tests
inputs:
  python-version:
    description: Version of Python to use
    required: true
  unit-test-directory:
    description: Path to unit tests
    required: false
    default: ''
  integration-test-directory:
    description: Path to integration tests
    required: false
    default: ''


runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      shell: bash -l {0}
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements-dev.txt
    - name: Run unit tests
      if: inputs.unit-test-directory != ''
      shell: bash -l {0}
      run:
        python -m unittest discover --verbose --catch \
            --start-directory ${{ inputs.unit-test-directory }}
    - name: Run integration tests
      if: inputs.integration-test-directory != ''
      shell: bash -l {0}
      run: |
        python -m unittest discover --verbose --catch \
            --start-directory ${{ inputs.integration-test-directory }}
