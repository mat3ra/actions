---

name: Run Python Tests
inputs:
  python-version:
    description: Version of Python to use
    required: true

  unit-test-directory:
    description: Path to unit tests
    required: false
    default: ''

  integration-test-directory:
    description: Path to integration tests
    required: false
    default: ''

  aws-access-key-id:
    description: AWS access key id
    required: false
    default: ''
  aws-secret-access-key:
    description: AWS secret access key
    required: false
    default: ''
  aws-region:
    description: AWS region to use
    required: false
    default: us-west-2

  az-tenant-id:
    description: Azure tenant id
    required: false
    default: ''
  az-subscription-id:
    description: Azure subscription id
    required: false
    default: ''
  az-client-id:
    description: Azure client id
    required: false
    default: ''
  az-client-secret:
    description: Azure client secret
    required: false
    default: ''
  az-storage-name:
    description: Azure storage name
    required: false
    default: ''
  az-storage-key:
    description: Azure storage key
    required: false
    default: ''

  gc-credentials:
    description: Google Cloud credentials JSON
    required: false
    default: ''
    
  test-script:
    description: Path to a script that runs tests
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Python Environment
      uses: ./actions/py/env

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        python -m pip install \
          pip==${PIP_VERSION} \
          setuptools==${SETUPTOOLS_VERSION} \
          wheel==${WHEEL_VERSION}
        pip install -r requirements-dev.txt

    - name: Run unit tests
      if: inputs.unit-test-directory != ''
      shell: bash -l {0}
      # yamllint disable rule:line-length
      run: python -m unittest discover --verbose --catch --start-directory ${{ inputs.unit-test-directory }}
      # yamllint enable rule:line-length

    - name: Configure AWS credentials
      if: inputs.integration-test-directory != ''
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Configure Azure credentials
      if: inputs.integration-test-directory != ''
      uses: Azure/login@v1
      with:
        creds: '{"clientId":"${{ inputs.az-client-id }}","clientSecret":"${{ inputs.az-client-secret }}","subscriptionId":"${{ inputs.az-subscription-id }}","tenantId":"${{ inputs.az-tenant-id }}"}'

    - name: Configure Google Cloud credentials
      if: inputs.integration-test-directory != ''
      uses: 'google-github-actions/auth@v1'
      with:
        credentials_json: ${{ inputs.gc-credentials }}

    - name: Run integration tests
      if: inputs.integration-test-directory != ''
      shell: bash -l {0}
      env:
        AZ_STORAGE_NAME: ${{ inputs.az-storage-name}}
        AZ_STORAGE_KEY: ${{ inputs.az-storage-key}}
      # yamllint disable rule:line-length
      run: python -m unittest discover --verbose --catch --start-directory ${{ inputs.integration-test-directory }}
      # yamllint enable rule:line-length

    - name: Run scripted tests
      if: inputs.test-script != ''
      shell: bash -l {0}
      run: |
        python ${{ inputs.test-script }}
