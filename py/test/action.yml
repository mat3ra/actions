---

name: Run Python Tests
inputs:
  python-version:
    description: Version of Python to use
    required: true

  unit-test-directory:
    description: Path to unit tests
    required: false
    default: ''

  integration-test-directory:
    description: Path to integration tests
    required: false
    default: ''

  aws-access-key-id:
    description: AWS access key id
    required: false
    default: ''

  aws-secret-access-key:
    description: AWS secret access key
    required: false
    default: ''

  az-client-id:
    description: Azure client id
    required: false
    default: ''

  az-client-secret:
    description: Azure client secret
    required: false
    default: ''

  az-storage-name:
    description: Azure storage name
    required: false
    default: ''

  az-storage-key:
    description: Azure storage key
    required: false
    default: ''

  gc-project-id:
    description: Google Cloud project id
    required: false
    default: ''

  gc-service-account-id:
    description: Google Cloud service account id
    required: false
    default: ''

  gc-service-account-secret:
    description: Google Cloud service account rsa private key
    required: false
    default: ''
    
  test-script:
    description: Path to a script that runs tests
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Python Environment
      uses: ./actions/py/env

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        python -m pip install \
          pip==${PIP_VERSION} \
          setuptools==${SETUPTOOLS_VERSION} \
          wheel==${WHEEL_VERSION}
        pip install -r requirements-dev.txt

    - name: Run unit tests
      if: inputs.unit-test-directory != ''
      shell: bash -l {0}
      # yamllint disable rule:line-length
      run: python -m unittest discover --verbose --catch --start-directory ${{ inputs.unit-test-directory }}
      # yamllint enable rule:line-length

    - name: Run integration tests
      if: inputs.integration-test-directory != ''
      shell: bash -l {0}
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AZ_CLIENT_ID: ${{ inputs.az-client-id }}
        AZ_CLIENT_SECRET: ${{ inputs.az-client-secret}}
        AZ_STORAGE_NAME: ${{ inputs.az-storage-name}}
        AZ_STORAGE_KEY: ${{ inputs.az-storage-key}}
        GC_PROJECT_ID: ${{ inputs.gc-project-id }}
        GC_SERVICE_ACCOUNT_ID: ${{ inputs.gc-service-account-id }}
        GC_SERVICE_ACCOUNT_SECRET: ${{ inputs.gc-service-account-secret }}
      # yamllint disable rule:line-length
      run: python -m unittest discover --verbose --catch --start-directory ${{ inputs.integration-test-directory }}
      # yamllint enable rule:line-length

    - name: Run scripted tests
      if: inputs.test-script != ''
      shell: bash -l {0}
      run: |
        python ${{ inputs.test-script }}
