---

name: Run Python Tests
inputs:
  python-version:
    description: Version of Python to use
    required: true

  bot-ssh-key:
    description: GitHub bot SSH private key
    required: false
    default: ''

  unit-test-directory:
    description: Path to unit tests
    required: false
    default: ''

  integration-test-directory:
    description: Path to integration tests
    required: false
    default: ''

  test-script:
    description: Path to a script that runs tests
    required: false
    default: ''

  requirements-file-basename:
    description: Basename of the requirements file
    required: false
    default: requirements.txt

  is_pyproject:
    description: Build virtualenv from pyproject.toml file
    required: false
    default: 'false'

  is_pytest:
    description: Use pytest instead of unittest
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Python Environment
      uses: ./actions/py/env

    - name: Setup ssh-agent
      if: inputs.bot-ssh-key != ''
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ inputs.bot-ssh-key }}

# Install dependencies if using requirements.txt
    - name: Replace "git+file" with "git+ssh" in requirements
      if: inputs.bot-ssh-key != '' && inputs.is_pyproject == 'false'
      shell: bash -l {0}
      run: |
        sed -i 's;git+file:///stack/lib/;git+ssh://git@github.com/Exabyte-io/;g' \
          ${{ inputs.requirements-file-basename }}

    - name: Install dependencies
      if: inputs.is_pyproject == 'false'
      shell: bash -l {0}
      run: |
        python -m pip install \
          pip==${PIP_VERSION} \
          setuptools==${SETUPTOOLS_VERSION} \
          wheel==${WHEEL_VERSION}
        pip install -r ${{ inputs.requirements-file-basename }}

# Install dependencies if using pyproject.toml
    - name: Replace "git+file" with "git+ssh" in pyproject.toml
      if: inputs.bot-ssh-key != '' && inputs.is_pyproject == 'true'
      shell: bash -l {0]
      run: |
        sed -i 's;git+file://./stack/lib/;git+ssh://git@github.com/Exabyte-io/;g' \
          pyproject.toml

    - name: Install dependencies
      if: inputs.is_pyproject == 'true'
      shell: bash -l {0}
      run: python3 -m pip install -e ".[tests]"


# Run tests with unittest
    - name: Run unit tests with unittest
      if: inputs.unit-test-directory != '' && inputs.is_pytest == 'false'
      shell: bash -l {0}
      # yamllint disable rule:line-length
      run: python -m unittest discover --verbose --catch --start-directory ${{ inputs.unit-test-directory }}
      # yamllint enable rule:line-length

    - name: Run integration tests
      if: inputs.integration-test-directory != ' '&& inputs.is_pytest == 'false'
      shell: bash -l {0}
      # yamllint disable rule:line-length
      run: python -m unittest discover --verbose --catch --start-directory ${{ inputs.integration-test-directory }}
      # yamllint enable rule:line-length

# Run tests with pytest
    - name: Run unit tests with pytest
      if: inputs.unit-test-directory != '' && inputs.is_pytest == 'true'
      shell: bash -l {0}
      run: |
        sudo env "PATH=$PATH" python3 -m pytest \
        --cov=src/ --cov-report term --cov-report=xml --cov-append \
        ${{ inputs.unit-test-directory }}

    - name: Run integration tests with pytest
      if: inputs.integration-test-directory != '' && inputs.is_pytest == 'true'
      shell: bash -l {0}
      run: |
        sudo env "PATH=$PATH" python3 -m pytest \
        --cov=src/ --cov-report term --cov-report=xml --cov-append \
        ${{ inputs.integration-test-directory }}

    - name: Run scripted tests
      if: inputs.test-script != ''
      shell: bash -l {0}
      run: |
        python ${{ inputs.test-script }}
