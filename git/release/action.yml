name: Release to Github
inputs:
  github-token:
    description: "grants access to github repository"
    required: true
    default: ""
  tag-name:
    description: "name of tag to push and release"
    required: true
    default: ""
  sync-branch:
    description: "string which if 'true', will push commits back to branch"
    required: true
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Sync Branch
      if: inputs.sync-branch == "true"
      shell: bash -l {0}
      run: git push --force origin ${{ github.ref_name }}
    - name: Create Tag
      shell: bash -l {0}
      run: git push origin ${{ inputs.tag-name }}
    - name: Create Release
      shell: bash -l {0}
      run: |
        URL=https://api.github.com/repos/${{ github.repository }}/releases
        TAG=${{ inputs.tag-name }}
        TOKEN=${{ inputs.github-token }}
        create_payload() {
          cat <<EOF
          {
            "tag_name": "${TAG}",
            "name": "Release ${TAG}",
            "body": "This is automated release ${TAG} created by exabyte-io-bot."
          }
          EOF
        }
        echo "release url: ${URL}"
        echo "release payload: $(create_payload)"
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: Bearer ${TOKEN}" \
          "${URL}" -d "$(create_payload)"

