---

name: Release to Github
inputs:
  github-token:
    description: >-
      grants access to github repository; the built-in GITHUB_TOKEN works when the calling
      job grants contents write
    required: true
    default: ''
  tag-name:
    description: name of tag to push and release
    required: true
    default: ''
  skip-publish:
    description: whether to only create tag and not publish it
    required: true
    default: ''
  assets:
    description: optional asset paths to attach to the release, one path per line
    required: false
    default: ''
  dispatch-workflows:
    description: >-
      optional workflows to start on the new tag once the release exists, one per line: a
      workflow file name, then any `gh workflow run` fields, such as -f publish=true. A
      release created with the built-in GITHUB_TOKEN fires no release event, so workflows
      that wait for one never start; this starts them instead. The calling job needs
      actions write
    required: false
    default: ''

runs:
  using: composite
  steps:

    - name: Create git tag
      shell: bash -l {0}
      env:
        TAG_NAME: ${{ inputs.tag-name }}
      run: git tag "${TAG_NAME}"

    - name: Push Tag To Remote
      if: inputs.skip-publish == ''
      shell: bash -l {0}
      env:
        TAG_NAME: ${{ inputs.tag-name }}
      run: |
          git push origin "${TAG_NAME}"
          sleep 15  # give github time to register the tag before publishing

    - name: Create Release
      if: inputs.skip-publish == ''
      shell: bash -l {0}
      env:
        # the same token git/config logs gh in with, so a caller that runs git/config
        # first sees no change; a caller without it needs this
        GH_TOKEN: ${{ inputs.github-token }}
        TAG_NAME: ${{ inputs.tag-name }}
        RELEASE_ASSETS: ${{ inputs.assets }}
      run: |
          NOTES="Release ${TAG_NAME} created by exabyte-io-bot"
          ASSET_PATHS=()
          # trim whitespace from each asset path
          while IFS= read -r asset || [[ -n "${asset}" ]]; do
            asset="${asset#"${asset%%[![:space:]]*}"}"
            asset="${asset%"${asset##*[![:space:]]}"}"
            [[ -z "${asset}" ]] && continue
            ASSET_PATHS+=("${asset}")
          done <<< "${RELEASE_ASSETS}"
          gh release create "${TAG_NAME}" --title "v${TAG_NAME}" \
            --notes "${NOTES}" "${ASSET_PATHS[@]}"

    - name: Start workflows on the new tag
      if: inputs.skip-publish == '' && inputs.dispatch-workflows != ''
      shell: bash -l {0}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG_NAME: ${{ inputs.tag-name }}
        DISPATCH_WORKFLOWS: ${{ inputs.dispatch-workflows }}
      run: |
          set -e
          # each line: a workflow file name, then any `gh workflow run` fields
          while IFS= read -r line || [[ -n "${line}" ]]; do
            read -r -a words <<< "${line}"
            [[ ${#words[@]} -eq 0 ]] && continue
            gh workflow run "${words[0]}" --repo "${GITHUB_REPOSITORY}" \
              --ref "${TAG_NAME}" "${words[@]:1}"
          done <<< "${DISPATCH_WORKFLOWS}"
