---

name: Configure Git Repository
inputs:
  github-token:
    description: grants access to github repository
    required: true
  github-repo:
    description: the name of the repository
    required: false

runs:
  using: composite
  steps:
    - name: Configure git for bot account
      shell: bash -l {0}
      env:
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
        GITHUB_REPO_INPUT: ${{ inputs.github-repo }}
      run: |
        # configure git repository for downstream interaction
        REPO_NAME="${GITHUB_REPO_INPUT:-$GITHUB_REPOSITORY}"
        # Authenticate with a header, not a token in the remote URL: libcurl 7.81.0-1ubuntu1.30
        # (ubuntu-22.04 image 20261018) strips credentials from CURLINFO_EFFECTIVE_URL, which
        # git up to 2.55 reads as a redirect, so it drops them and the fetch fails with
        # "could not read Username".
        # Keep the token in .git/config only: exporting it to $GITHUB_ENV would
        # expose it to every later step in the job, including third-party actions.
        AUTH_HEADER=$(printf 'x-access-token:%s' "${GITHUB_TOKEN_INPUT}" | base64 | tr -d '\n')
        echo "::add-mask::${AUTH_HEADER}"
        git remote set-url origin "https://github.com/${REPO_NAME}.git"
        # An empty value clears headers set earlier (such as a persisted checkout token),
        # which would otherwise be sent alongside this one.
        git config --local --unset-all http.https://github.com/.extraheader || true
        git config --local --add http.https://github.com/.extraheader ""
        git config --local --add http.https://github.com/.extraheader \
          "AUTHORIZATION: basic ${AUTH_HEADER}"
        git config user.name "exabyte-io-bot"
        git config user.email "info@exabyte.io"
    - name: Authenticate to github CLI
      shell: bash -l {0}
      env:
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
      run: |
        # configure github cli for automatic release generation
        printf '%s' "${GITHUB_TOKEN_INPUT}" | gh auth login --with-token
    - name: Fetch git tags
      # Only trigger fetch if setting up for the current repo, not another one
      if: inputs.github-repo == ''
      shell: bash -l {0}
      run: |
        # fetch all git tags for version logic
        # To avoid: `--unshallow on a complete repository does not make sense`
        git fetch --prune --unshallow --tags || git fetch --prune --tags
