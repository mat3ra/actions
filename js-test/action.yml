name: Run JS Tests
inputs:
  node-version:
    required: true
  checkout-lfs:
    description: "if true, run git lfs pull"
    required: false
    default: false

runs:
  using: "composite"
  steps:
    - name: Checkout LFS objects
      if: inputs.checkout-lfs
      run: git lfs pull
    - name: Setup NodeJS
      uses: actions/setup-node@v1
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install
      run: npm install
    - name: Build
      run: npm run build --if-present
    - name: Test
      run: npm test

