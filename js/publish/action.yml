name: Publish NPM Package and Git Release
inputs:
  node-version:
    description: "Version of Node to use"
    required: false
  checkout-lfs:
    description: "if true, run git lfs pull"
    required: false
    default: false
  npm-token:
    description: "grants access to publish releases to NPM"
    required: true
    default: ""
  github-token:
    description: "grants acces to publish releases to github"
    required: true 
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout LFS objects
      if: inputs.checkout-lfs
      shell: bash -l {0}
      run: git lfs pull
    - name: Setup NodeJS
      uses: actions/setup-node@v2
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org
    - name: Install
      shell: bash -l {0}
      run: npm install
    - name: Verify tests
      shell: bash -l {0}
      run: npm test
    - name: Configure repository
      id: configure-repo
      uses: Exabyte-io/actions/git/config@main
      with:
        github-token: ${{ secrets.BOT_GITHUB_TOKEN }}

    - name: Publish release to NPM
      shell: bash -l {0}
      id: npm-publish
      run: |
          # Determine which npm version command to run based
          # on already published packages and today's date
          NPM_PKG=${{ steps.configure-repo.outputs.npm-repo }}
          VERSIONS=$(npm show @${NPM_PKG} versions)
          DATE=$(date +%Y.%m.%d)
          if [[ "${VERSIONS}" != *"${DATE}"* ]]; then  # did we publish date yet
              cmd="npm version ${DATE}-0"              # date's first release
          else
              cmd="npm version prerelease"; fi         # pre-release covers it
          echo "published versions: ${VERSIONS}"
          echo "npm command to run: ${cmd}"
          # create new version and publish
          # Note: this cmd creates a new commit on the branch
          # which is why we want to sync-branch in the next step
          VERSION=$(${cmd})
          echo "::set-output name=version::$(echo ${VERSION})"
          npm publish
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}

    - name: Publish Tag & Release to Github
      uses: Exabyte-io/actions/git/release@main
      with:
        github-token: ${{ secrets.BOT_GITHUB_TOKEN }}
        tag-name: ${{ steps.npm-publish.outputs.version }}
        sync-branch: "true"

