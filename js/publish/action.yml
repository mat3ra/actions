name: Publish NPM Package and Git Release
inputs:
  node-version:
    description: "Version of Node to use"
    required: false
  checkout-lfs:
    description: "if true, run git lfs pull"
    required: false
    default: false
  npm-token:
    description: "grants access to publish releases to NPM"
    required: true
    default: ""
  github-token:
    description: "grants acces to publish releases to github"
    required: true 
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout LFS objects
      if: inputs.checkout-lfs
      shell: bash -l {0}
      run: git lfs pull
    - name: Setup NodeJS
      uses: actions/setup-node@v2
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://registry.npmjs.org'
        always-auth: true
    - name: Install
      shell: bash -l {0}
      run: npm install
    - name: Verify tests
      shell: bash -l {0}
      run: npm test
    - name: Configure repository
      uses: ./actions/git/config
      with:
        github-token: ${{ inputs.github-token }}

    - name: Get NPM Repo Name
      id: npm-repo
      shell: bash -l {0}
      run: |
        GITHUB_REPOSITORY_PATH=${{ github.repository }}
        # github organization name is Exabyte-io but npm organization name is exabyte-io
        NPM_REPOSITORY_PATH=$(echo ${GITHUB_REPOSITORY_PATH} | tr '[:upper:]' '[:lower:]')
        echo "::set-output name=npm-repository-path::$(echo ${NPM_REPOSITORY_PATH})"

    - name: Publish release to NPM
      shell: bash -l {0}
      id: npm-publish
      run: |
          # Determine which npm version command to run based
          # on already published packages and today's date
          NPM_REPOSITORY_PATH=${{ steps.npm-repo.outputs.npm-repository-path }}
          NPM_VERSIONS=$(npm show @${NPM_REPOSITORY_PATH} versions)
          DATE=$(date +%Y.%m.%d)
          if [[ "${NPM_VERSIONS}" != *"${DATE}"* ]]; then  # did we publish date yet
              cmd="npm version ${DATE}-0"                  # date's first release
          else
              cmd="npm version prerelease"; fi             # pre-release covers it
          echo "npm pkg repository: ${NPM_REPOSITORY_PATH}"
          echo "published versions: ${NPM_VERSIONS}"
          echo "npm command to run: ${cmd}"
          # create new version and publish
          # Note: this cmd creates a new commit on the branch
          # which is why we want to sync-branch in the next step
          PUBLISHED_VERSION=$(${cmd})
          echo "::set-output name=published-version::$(echo ${PUBLISHED_VERSION})"
          npm publish
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}

    - name: Publish Tag & Release to Github
      uses: ./actions/git/release
      with:
        github-token: ${{ inputs.github-token }}
        tag-name: ${{ steps.npm-publish.outputs.published-version }}
        sync-branch: "true"

