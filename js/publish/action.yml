---

name: Publish NPM Package and Git Release
description: Uses today's date and npm version to determine new tag. See README for more detail.
inputs:
  node-version:
    description: Version of Node to use
    required: false
  npm-token:
    description: grants access to publish releases to NPM
    required: true
  github-token:
    description: grants access to publish releases to github
    required: true
  verify-tests:
    description: if true, run npm test
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v2
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org
        always-auth: true
    - name: Install
      shell: bash -l {0}
      run: npm install
    - name: Verify tests
      if: inputs.verify-tests == 'true'
      shell: bash -l {0}
      run: npm test
    - name: Configure repository
      uses: ./actions/git/config
      with:
        github-token: ${{ inputs.github-token }}

    - name: Prepare NPMIgnore
      shell: bash -l {0}
      run: |
        # npm uses .gitignore by default if .npmignore is not present
        # but if .npmignore is present, it will not use .gitignore
        # and we want .npmignore to be a superset of files to ignore
        cat .gitignore >> .npmignore   # if .npmignore not specified, defaults to .gitignore
        cat npmignore >> .npmignore 2>/dev/null  # add real npmignore contents if they exist
        echo "actions/" >> .npmignore  # don't package our composite actions into NPM packages
        echo ".github/" >> .npmignore  # don't package our project actions either

    - name: Publish release to NPM
      shell: bash -l {0}
      id: npm-publish
      run: |
          # Determine which npm version command to run based
          # on already published packages and today's date
          NPM_REPOSITORY=$(jq -r .name package.json)
          NPM_VERSIONS=$(npm show ${NPM_REPOSITORY} versions)
          DATE=$(date +%Y.%-m.%-d)
          if [[ "${NPM_VERSIONS}" != *"${DATE}"* ]]; then  # did we publish date yet
              cmd="npm version ${DATE}-0"                  # date's first release
          else
              cmd="npm version prerelease"; fi             # pre-release covers it
          echo "npm pkg repository: ${NPM_REPOSITORY}"
          echo "published versions: ${NPM_VERSIONS}"
          echo "npm command to run: ${cmd}"
          # create new version and publish
          # Note: this cmd creates a new commit on the branch
          # which is why we want to sync-branch in the next step
          PUBLISHED_VERSION=$(${cmd})
          echo "::set-output name=published-version::$(echo ${PUBLISHED_VERSION})"
          npm publish
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}

    - name: Publish Tag & Release to Github
      uses: ./actions/git/release
      with:
        github-token: ${{ inputs.github-token }}
        tag-name: ${{ steps.npm-publish.outputs.published-version }}
        sync-branch: 'true'
