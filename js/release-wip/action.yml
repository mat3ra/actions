---
name: Publish WIP Release Tarball
description: |
  Builds the package and publishes it as a GitHub pre-release tarball asset tagged after
  the current commit, so consumers can install a not-yet-mergeable WIP commit without the
  package needing to commit its build output (e.g. dist/) to git. Each commit gets its own
  immutable tag/asset - re-running on the same commit (e.g. a re-triggered workflow)
  updates that commit's release/asset in place rather than minting a duplicate.
inputs:
  node-version:
    description: Version of Node to use
    required: false
    default: 20.x
  package-name:
    description: |
      Name of the package being released, e.g. "esse". Used for the asset filename
      (<package-name>.tgz) and the release title.
    required: true
  build-script:
    description: npm script that produces the build output packed by `npm pack`
    required: false
    default: transpile
  tag-name:
    description: |
      Release tag to publish under. Defaults to `wip-<short-commit-sha>` (the current
      commit being built), so each commit gets its own immutable tag/asset URL.
    required: false
    default: ''
  github-token:
    description: grants access to publish releases to github
    required: true
outputs:
  tag-name:
    description: Tag the release was published under
    value: ${{ steps.get-tag-name.outputs.tag-name }}

runs:
  using: composite
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install
      shell: bash -l {0}
      run: npm ci

    - name: Build
      shell: bash -l {0}
      run: npm run ${{ inputs.build-script }}

    - name: Pack tarball
      shell: bash -l {0}
      run: |
        find . -maxdepth 1 -name "*.tgz" -delete
        npm pack
        mv "$(ls -1 *.tgz | head -n 1)" "${{ inputs.package-name }}.tgz"

    - name: Determine tag name
      id: get-tag-name
      shell: bash -l {0}
      run: |
        if [[ -n "${{ inputs.tag-name }}" ]]; then
          TAG_NAME="${{ inputs.tag-name }}"
        else
          TAG_NAME="wip-$(echo "${{ github.sha }}" | cut -c1-7)"
        fi
        echo "tag name: ${TAG_NAME}"
        echo "tag-name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

    - name: Publish release
      shell: bash -l {0}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        TAG_NAME="${{ steps.get-tag-name.outputs.tag-name }}"
        ASSET="${{ inputs.package-name }}.tgz"
        if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
          gh release upload "${TAG_NAME}" "${ASSET}" --clobber
        else
          gh release create "${TAG_NAME}" "${ASSET}" \
            --prerelease --title "${{ inputs.package-name }} WIP: ${TAG_NAME}" \
            --notes "Pre-release build for testing in consumers (not for production use)."
        fi
