name: Run JS Tests
inputs:
  node-version:
    description: "Version of Node to use"
    required: false
  checkout-lfs:
    description: "if true, run git lfs pull"
    required: false
    default: false

runs:
  using: "composite"
  steps:
    - name: Checkout LFS objects
      if: inputs.checkout-lfs
      shell: bash -l {0}
      run: git lfs pull
    - name: Setup NodeJS
      uses: actions/setup-node@v2
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install
      shell: bash -l {0}
      run: npm install
    - name: Build
      shell: bash -l {0}
      run: npm run build --if-present
    - name: Test
      shell: bash -l {0}
      run: npm test
    - name: Debug
      shell: bash -l {0}
      run: |
        echo ${{ github.repository }}
        VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        echo parsed version "$VERSION"

