---

name: Run JS Tests
inputs:
  node-version:
    description: Version of Node to use
    required: false

runs:
  using: composite
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v2
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install
      shell: bash -l {0}
      run: |
        npm install
        NPM_REPOSITORY_PATH=$(jq -r .name package.json)
        echo $NPM_REPOSITORY_PATH
    - name: Build
      shell: bash -l {0}
      run: npm run build --if-present
    - name: Test
      shell: bash -l {0}
      run: npm test
