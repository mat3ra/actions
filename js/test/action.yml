---

name: Run JS Tests
inputs:
  node-version:
    description: Version of Node to use
    required: false
  install-meteor:
    description: Whether or not to install meteor in npm globals
    required: false
    default: 'false'
  install-chromedriver:
    description: Whether or not to install chromedriver
    required: false
    default: 'false'
  chromedriver-version:
    description: Chromedriver version to be installed
    required: false
    # This is driver for ubuntu-latest browser:
    # 104.0.5112.101 by default with binary path /usr/bin/google-chrome
    # yamllint disable rule:quoted-strings
    default: '104.0.0'
    # yamllint enable rule:quoted-strings
  package-directory:
    description: |
      Directory containing the package.json file dictating what to test.
      Also calls js/validate action forwarding this parameter as package-directory.
    required: false
    default: .
  skip-validation:
    description: Whether to run the validation action
    required: false
    default: 'false'
  meteor-version:
    description: Meteor version to be installed globally
    required: false
    default: 2.7.3

runs:
  using: composite
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v2
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install meteor
      shell: bash -l {0}
      if: inputs.install-meteor == 'true'
      run: npm install -g meteor@${{ inputs.meteor-version }}
    - name: Install
      shell: bash -l {0}
      run: cd ${{ inputs.package-directory }} && npm install
    - name: Install ChromeDriver
      shell: bash -l {0}
      if: inputs.install-chromedriver == 'true'
      # yamllint disable rule:line-length
      run: |
        echo "Attempting to get match Chrome and Chromedriver versions"
        # Should get the main version per https://askubuntu.com/questions/505531/what-version-of-google-chrome-do-i-have
        CHROME_MAIN_VERSION=`google-chrome --version | grep -iEo "[0-9]{1,4}.[0-9]{1,3}" | head -1`
        if [[ $CHROME_MAIN_VERSION == "" ]]; then
          CHROMEDRIVER_VERSION="{{ inputs.chromedriver-version }}";
          echo "Set Chrome Version from input to $CHROMEDRIVER_VERSION"
        else 
          CHROMEDRIVER_VERSION="$CHROME_MAIN_VERSION".0
          echo "Set Chrome Version from OS to $CHROMEDRIVER_VERSION"
        fi
        cd ${{ inputs.package-directory }} && npm install chromedriver@${CHROMEDRIVER_VERSION}
      # yamllint enable rule:line-length
    - name: Build
      shell: bash -l {0}
      run: cd ${{ inputs.package-directory }} && npm run build --if-present
    - name: Test
      shell: bash -l {0}
      run: cd ${{ inputs.package-directory }} && npm test
    - name: Validate
      if: inputs.skip-validation != 'false'
      uses: ./actions/js/validate
      with:
        package-directory: ${{ inputs.package-directory }}

