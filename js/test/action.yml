---

name: Run JS Tests
inputs:
  node-version:
    description: Version of Node to use
    required: false
  package-directory:
    description: |
      Directory containing the package.json file dictating what to test.
      Also calls js/validate action forwarding this parameter as package-directory.
    required: false
    default: .
  skip-validation:
    description: Whether to run the validation action
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v2
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install
      shell: bash -l {0}
      run: cd ${{ inputs.package-directory }} && npm install
    - name: Build
      shell: bash -l {0}
      run: cd ${{ inputs.package-directory }} && npm run build --if-present
    - name: Test
      shell: bash -l {0}
      run: cd ${{ inputs.package-directory }} && npm test
    - name: Validate
      if: inputs.skip-validation != 'false'
      uses: ./actions/js/validate
      with:
        package-directory: ${{ inputs.package-directory }}

