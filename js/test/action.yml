---

name: Run JS Tests
inputs:
  node-version:
    description: Version of Node to use
    required: false
  validate-package-directory:
    description: |
      Call the js/validate action forwarding this parameter as package-directory.
      Explicitly pass an empty string '' to skip validation.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v2
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install
      shell: bash -l {0}
      run: npm install
    - name: Build
      shell: bash -l {0}
      run: npm run build --if-present
    - name: Test
      shell: bash -l {0}
      run: npm test
    - name: Validate
      if: inputs.validate-package-directory != ''
      uses: ./actions/js/validate
      with:
        package-directory: ${{ inputs.validate-package-directory }}

