---

name: Run Yaml Linter
inputs:
  targets:
    description: A space separated list of files or directories
    required: false
    default: .

  python-version:
    description: Version of Python to use
    required: false
    default: '3.8'

  skip-setup-python:
    description: Whether to skip Python setup
    required: false
    default: 'false'

  skip-install-yamllint:
    description: Whether to skip the installation of yamllint
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      if: inputs.skip-setup-python == 'false'
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install yamllint
      if: inputs.skip-install-yamllint == 'false'
      shell: bash -l {0}
      run: |
        python -m pip install wheel==0.37.1
        python -m pip install yamllint==1.26.3

    - name: Run linter
      shell: bash -l {0}
      run: yamllint ${{ inputs.targets }}

