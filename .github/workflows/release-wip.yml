---

name: Release WIP tarball (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Version of Node to use
        required: false
        type: string
        default: 24.x
      package-name:
        description: |
          Name of the package being released, e.g. "esse". Used for the asset filename
          (<package-name>.tgz) and the release title.
        required: true
        type: string
      build-script:
        description: npm script that produces the build output packed by `npm pack`
        required: false
        type: string
        default: transpile
      tag-name:
        description: |
          Release tag to publish under. Defaults to `wip-<short-commit-sha>` (the current
          commit being built), so each commit gets its own immutable tag/asset URL.
        required: false
        type: string
        default: ''
    secrets:
      github-token:
        description: grants access to publish releases to github
        required: true
    outputs:
      tag-name:
        description: Tag the release was published under
        value: ${{ jobs.release-wip.outputs.tag-name }}

jobs:
  release-wip:
    if: >-
      contains(github.event.head_commit.message, '[release]') &&
      github.ref_type == 'branch' &&
      github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.get-tag-name.outputs.tag-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install
        run: npm ci

      - name: Build
        run: npm run ${{ inputs.build-script }}

      - name: Pack tarball
        run: |
          find . -maxdepth 1 -name "*.tgz" -delete
          npm pack
          mv "$(ls -1 *.tgz | head -n 1)" "${{ inputs.package-name }}.tgz"

      - name: Determine tag name
        id: get-tag-name
        run: |
          if [[ -n "${{ inputs.tag-name }}" ]]; then
            TAG_NAME="${{ inputs.tag-name }}"
          else
            TAG_NAME="wip-$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          echo "tag name: ${TAG_NAME}"
          echo "tag-name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          TAG_NAME="${{ steps.get-tag-name.outputs.tag-name }}"
          ASSET="${{ inputs.package-name }}.tgz"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ASSET}" --clobber
          else
            gh release create "${TAG_NAME}" "${ASSET}" \
              --prerelease --title "${{ inputs.package-name }} WIP: ${TAG_NAME}" \
              --notes "Pre-release build for testing in consumers (not for production use)."
          fi
