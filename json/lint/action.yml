---

name: Run Yaml Linter
inputs:
  targets:
    description: A space separated list of files or directories
    required: false
    default: .

  python-version:
    description: Version of Python to use
    required: false
    default: '3.10'

  skip-setup-python:
    description: Whether to skip Python setup
    required: false
    default: 'false'

  skip-install-yamllint:
    description: Whether to skip the installation of yamllint
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      if: inputs.skip-setup-python == 'false'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install yamllint
      if: inputs.skip-install-yamllint == 'false'
      shell: bash -l {0}
      run: |
        python -m pip install wheel==0.37.1
        python -m pip install git+https://github.com/mat3ra/json-linter.git

    - name: Run linter
      shell: bash -l {0}
      run: json-linter  ${{ inputs.targets }} --config-set indent=4
